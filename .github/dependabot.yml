# Mises à jour automatiques des dépendances (docs/devsecops.md).
# cooldown : même délai de 7 jours que minimumReleaseAge (pnpm-workspace.yaml),
# une version fraîchement publiée (et potentiellement compromise) n'est
# jamais proposée. Les correctifs de sécurité restent proposés sans délai.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      correctifs-mineurs:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(infra)

  - package-ecosystem: docker-compose
    # Compose local (dev, CI) et staging : mêmes versions d'images partout.
    directories: [/infra, /infra/staging]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(infra)
