# Toron : environnement de staging (ADR-9), déployé à chaque fusion sur main.
# Exécuté sur le serveur dans /opt/toron par deployer.sh, jamais en local.
# Secrets : /opt/toron/.env, généré sur le serveur par bootstrap.sh (jamais
# dans le dépôt). Images : /opt/toron/images.env, écrit à chaque déploiement
# avec des références figées par digest.
#
# Réseau : seul Caddy publie des ports (80/443). L'application n'est jamais
# joignable directement, ce qui garantit que X-Forwarded-For est posé par
# Caddy et non par le client (rate limiting, journal d'audit). La base et le
# worker sont sur un réseau interne sans accès Internet ; le service mail
# n'en sort que par le réseau courriel.

name: toron

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?STAGING_DOMAIN manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Identifiants d'accès au staging (hash bcrypt), générés par bootstrap.sh.
      - ./acces.caddy:/etc/caddy/acces.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

  web:
    image: ${TORON_WEB_IMAGE:?TORON_WEB_IMAGE manquant (images.env)}
    restart: unless-stopped
    environment:
      DATABASE_URL_APP: postgres://toron_app_login:${TORON_APP_DB_PASSWORD:?}@db:5432/toron
      DATABASE_URL_AUTH: postgres://toron_auth_login:${TORON_AUTH_DB_PASSWORD:?}@db:5432/toron
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: https://${STAGING_DOMAIN:?}
      NEXT_TELEMETRY_DISABLED: "1"
      # Sans TORON_ENV, le web se croirait en local : ni MAIL_OUTBOX_KEY ni
      # le https de BETTER_AUTH_URL ne seraient exigés au démarrage. Même
      # clé que le service mail (scellement des liens).
      TORON_ENV: staging
      MAIL_OUTBOX_KEY: ${MAIL_OUTBOX_KEY:?}
      # Obligatoire en production : sans réponse de clamd, les dépôts sont refusés.
      CLAMAV_URL: tcp://clamav:3310
    networks: [edge, backend]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/connexion"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
      # Cache Next.js (ISR, images) : non persistant, réinitialisé au redémarrage.
      - /app/apps/web/.next/cache:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker:
    image: ${TORON_WORKER_IMAGE:?TORON_WORKER_IMAGE manquant (images.env)}
    restart: unless-stopped
    environment:
      DATABASE_URL_APP: postgres://toron_app_login:${TORON_APP_DB_PASSWORD:?}@db:5432/toron
      PUBLIC_BASE_URL: https://${STAGING_DOMAIN:?}
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Service mail isolé (ADR-8), même image que le worker : seul détenteur de
  # la clé Scaleway TEM. Le réseau courriel lui ouvre l'API TEM en HTTPS ; la
  # base reste sur le réseau interne. Variables : docs/exploitation-courriel.md.
  mail:
    image: ${TORON_WORKER_IMAGE:?TORON_WORKER_IMAGE manquant (images.env)}
    restart: unless-stopped
    command: ["node", "workers/src/mail.ts"]
    environment:
      TORON_ENV: staging
      DATABASE_URL_MAIL: postgres://toron_mail_login:${TORON_MAIL_DB_PASSWORD:?}@db:5432/toron
      MAIL_OUTBOX_KEY: ${MAIL_OUTBOX_KEY:?}
      # Renseignée pendant une rotation de MAIL_OUTBOX_KEY seulement.
      MAIL_OUTBOX_KEY_PRECEDENTE: ${MAIL_OUTBOX_KEY_PRECEDENTE:-}
      # fichier tant que le domaine d'envoi n'est pas vérifié dans TEM, puis scaleway.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:?MAIL_TRANSPORT manquant dans .env (fichier ou scaleway)}
      MAIL_FICHIER_DIR: /var/toron/courriels
      MAIL_FROM: ${MAIL_FROM:-ne-pas-repondre@staging.notifications.toron.eu}
      PUBLIC_BASE_URL: https://${STAGING_DOMAIN:?}
      SCW_TEM_SECRET_KEY: ${SCW_TEM_SECRET_KEY:-}
      SCW_TEM_PROJECT_ID: ${SCW_TEM_PROJECT_ID:-}
      SCW_TEM_REGION: ${SCW_TEM_REGION:-fr-par}
      # Obligatoire avec scaleway : seules les adresses de l'équipe reçoivent.
      MAIL_DESTINATAIRES_AUTORISES: ${MAIL_DESTINATAIRES_AUTORISES:-}
      MAIL_ENVOI_SUSPENDU: ${MAIL_ENVOI_SUSPENDU:-}
    networks: [backend, courriel]
    volumes:
      - courriels:/var/toron/courriels
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "workers/src/mail-health.ts"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # Le service termine l'envoi en cours, puis force l'arrêt à 12 s.
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Antivirus à l'ingestion (clamd), joint par l'application sur le réseau
  # interne. Un réseau dédié lui laisse télécharger ses signatures (freshclam).
  # Environ 1 Go de mémoire : prévoir 4 Go de RAM sur le serveur. Capacités
  # réduites au strict nécessaire au changement d'utilisateur de l'image.
  clamav:
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    restart: unless-stopped
    networks: [backend, antivirus]
    volumes:
      - clamav-db:/var/lib/clamav
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]

  # Tâche ponctuelle lancée par deployer.sh : migrations puis seed (idempotent)
  # avec le rôle propriétaire du schéma, jamais avec le rôle applicatif (S5).
  migrations:
    image: ${TORON_WORKER_IMAGE:?TORON_WORKER_IMAGE manquant (images.env)}
    profiles: [outils]
    environment:
      DATABASE_URL_MIGRATIONS: postgres://toron_admin:${POSTGRES_PASSWORD:?}@db:5432/toron
    command: ["sh", "-c", "node packages/db/src/migrate-cli.ts && node packages/db/src/seed-cli.ts"]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  db:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    restart: unless-stopped
    environment:
      POSTGRES_DB: toron
      POSTGRES_USER: toron_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      # Lus uniquement par initdb/01-roles.sh, au premier démarrage.
      TORON_APP_DB_PASSWORD: ${TORON_APP_DB_PASSWORD:?}
      TORON_AUTH_DB_PASSWORD: ${TORON_AUTH_DB_PASSWORD:?}
      TORON_MAIL_DB_PASSWORD: ${TORON_MAIL_DB_PASSWORD:?}
    volumes:
      # PostgreSQL 18+ : données dans /var/lib/postgresql/18/docker, volume
      # monté sur /var/lib/postgresql (l'image refuse l'ancien chemin .../data).
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toron_admin -d toron"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]

networks:
  edge: {}
  backend:
    internal: true
  # Sortie vers les serveurs de signatures ClamAV, et rien d'autre ne s'y attache.
  antivirus: {}
  # Sortie du service mail vers l'API Scaleway TEM, et rien d'autre ne s'y attache.
  courriel: {}

volumes:
  pgdata: {}
  clamav-db: {}
  # Dépôt du transport fichier, initialisé depuis l'image (toron, mode 700).
  courriels: {}
  caddy-data: {}
  caddy-config: {}
