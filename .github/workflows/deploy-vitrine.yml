name: Déploiement vitrine

# Vitrine (apps/site, export statique) publiée sur Cloudflare Pages (ADR-9).
# Ne publie que main (code déjà validé par la CI de la PR), quand la vitrine
# change, ou manuellement. Mise en place : docs/deploiement-vitrine.md

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-vitrine.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vitrine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Build SANS aucun secret : les scripts de dépendances et l'outillage de
  # build ne voient jamais le jeton de déploiement.
  build:
    name: Build (export statique + en-têtes)
    runs-on: ubuntu-latest
    # Job « skipped » (visible) tant que la variable de dépôt
    # CLOUDFLARE_ACCOUNT_ID n'est pas définie.
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @toron/site
      - run: pnpm --filter @toron/site test
      # next build + génération de out/_headers (CSP à empreintes, HSTS, etc.)
      - run: pnpm --filter @toron/site build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitrine
          path: apps/site/out
          if-no-files-found: error
          retention-days: 7

  # Seul job exposé au jeton : aucun checkout, aucune dépendance du projet,
  # uniquement wrangler (version épinglée, scripts d'installation désactivés).
  deploy:
    name: Déploiement Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: vitrine
      url: https://toron.nullsec.fr
    env:
      PAGES_PROJECT: toron-vitrine
      WRANGLER_VERSION: 4.136.3
      WRANGLER_SEND_METRICS: 'false'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vitrine
          path: out
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN absent : créez-le (environnement « vitrine ») comme décrit dans docs/deploiement-vitrine.md, puis relancez."
            exit 1
          fi
          test -f out/_headers || { echo "::error::out/_headers manquant, le build n'a pas généré les en-têtes de sécurité."; exit 1; }
          npm exec --yes --package="wrangler@${WRANGLER_VERSION}" -- \
            wrangler pages deploy out \
              --project-name="$PAGES_PROJECT" \
              --branch=main \
              --commit-hash="$COMMIT_SHA"
