packages:
  - apps/*
  - packages/*
  - workers

# ── Durcissement supply chain (S7) ─────────────────────────────────────
# Refuse d'exécuter les scripts d'installation sauf autorisation explicite
allowBuilds:
  esbuild: true
  sharp: true
  # Refusés — fallbacks JS purs suffisants (devDeps testcontainers)
  cpu-features: false
  protobufjs: false
  ssh2: false
# Correctifs de sécurité imposés aux dépendances transitives : next épingle
# postcss 8.4.31 (GHSA-r28c-9q8g-f849, GHSA-6g55-p6wh-862q) et accepte sharp
# 0.34 (vulnérabilités libvips/libheif) ; sharp 0.35.5 corrige librsvg
# (GHSA-wq5f-xc86-pv6w). À retirer quand next les remonte.
overrides:
  postcss: ^8.5.28
  sharp: ^0.35.5
# Attend 7 jours avant de résoudre une version fraîchement publiée
minimumReleaseAge: 10080
# Bloque les sous-dépendances hors registre npm (git, http, …)
blockExoticSubdeps: true
# Empêche une mise à jour de paquet d'assouplir ces réglages
trustPolicy: no-downgrade
# Versions de Node imposées par le champ engines
engineStrict: true
