name: CodeQL

# Analyse sémantique du code (flux de données : injections, XSS, SSRF,
# désérialisation, etc.) et des workflows GitHub Actions. Résultats dans l'onglet
# Security ; une alerte nouvelle sur une PR bloque via les règles du dépôt.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyse:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # publication SARIF dans l'onglet Security
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # Maquettes HTML de référence : jamais exécutées en production.
          config: |
            paths-ignore:
              - docs
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
