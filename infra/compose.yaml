# Toron — environnement local (DoD M0 : « l'app tourne en Docker local »).
# Usage : docker compose -f infra/compose.yaml up --build
# Les identifiants ci-dessous sont locaux uniquement — jamais utilisés hors poste dev.

services:
  db:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    environment:
      POSTGRES_DB: toron
      POSTGRES_USER: toron_local
      POSTGRES_PASSWORD: toron_local_dev_only
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ : données dans /var/lib/postgresql/18/docker, volume
      # monté sur /var/lib/postgresql (l'image refuse l'ancien chemin .../data).
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toron_local -d toron"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    environment:
      DATABASE_URL_APP: postgres://toron_app_login:toron_app_dev_only@db:5432/toron
      DATABASE_URL_AUTH: postgres://toron_auth_login:toron_auth_dev_only@db:5432/toron
      # Secret de dev local uniquement — généré aléatoirement par
      # environnement réel via le gestionnaire de secrets (S3).
      BETTER_AUTH_SECRET: dev_local_secret_32_caracteres_min_x
      BETTER_AUTH_URL: http://localhost:3000
      # Analyse antivirus des fichiers déposés : sans réponse de clamd, les
      # dépôts sont refusés. Pas de dépendance de démarrage : l'application
      # tourne pendant que clamd charge ses signatures.
      CLAMAV_URL: tcp://clamav:3310
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Antivirus à l'ingestion (clamd). Environ 1 Go de mémoire une fois les
  # signatures chargées ; premier démarrage de quelques minutes.
  clamav:
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    volumes:
      - clamav-db:/var/lib/clamav

  # Worker de livrables scellés (Typst) — ADR-5/7.
  worker:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    environment:
      DATABASE_URL_APP: postgres://toron_app_login:toron_app_dev_only@db:5432/toron
      PUBLIC_BASE_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  # Service mail isolé (ADR-8), même image que le worker. Transport fichier :
  # aucun envoi réel, chaque e-mail est déposé dans .courriels/ à la racine du
  # dépôt (gitignoré) ; ouvrir .courriels/<id>.html dans le navigateur.
  mail:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    command: ["node", "workers/src/mail.ts"]
    environment:
      TORON_ENV: local
      DATABASE_URL_MAIL: postgres://toron_mail_login:toron_mail_dev_only@db:5432/toron
      # Clé de scellement de dev local uniquement, partagée avec le web.
      MAIL_OUTBOX_KEY: dev_local_cle_courriel_32_caracteres_min
      MAIL_TRANSPORT: fichier
      MAIL_FICHIER_DIR: /var/toron/courriels
      MAIL_FROM: ne-pas-repondre@toron.localhost
      PUBLIC_BASE_URL: http://localhost:3000
    volumes:
      - ../.courriels:/var/toron/courriels
    healthcheck:
      test: ["CMD", "node", "workers/src/mail-health.ts"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # Le service termine l'envoi en cours, puis force l'arrêt à 12 s.
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  clamav-db:
